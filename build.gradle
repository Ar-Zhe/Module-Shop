plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.24'
}

version = "${mod_version}-forge-${minecraft_version}"
group = mod_group_id
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenLocal()
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

// ---------------------------------------------------------------- KubeJS 桥接（可选）
// 传 -PkubejsJar=<kubejs-forge 的 jar 路径> 才会编译桥接源码；不传时完全不参与构建，
// 主模组不依赖 KubeJS。1.20.1 用 kubejs-forge（2001.x）。
def kubejsJarPath = project.findProperty('kubejsJar')
if (kubejsJarPath) {
    sourceSets {
        kubejsBridge {
            java.srcDirs = ['src/kubejs-bridge/java']
            resources.srcDirs = ['src/kubejs-bridge/resources']
            compileClasspath += sourceSets.main.output + configurations.compileClasspath
            runtimeClasspath += sourceSets.main.output + configurations.runtimeClasspath
        }
    }
    dependencies {
        kubejsBridgeImplementation files(kubejsJarPath)
    }
    tasks.named('jar', Jar).configure {
        from sourceSets.kubejsBridge.output
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: '[1.20.1,1.21)',
            forge_version: forge_version, forge_version_range: '[47,)',
            loader_version_range: '[47,)',
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // 用 JDK 21 编译，但产物按 1.20.1 的 Java 17 目标输出
    options.release = 17
}